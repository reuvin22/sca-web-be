# DigitalOcean App Platform spec for the SCA backend. NOT IN USE YET (the backend runs on Render).
# To use it later:
#   1. Replace the github repo/branch below.
#   2. doctl apps create --spec .do/app.yaml   (or: Apps > Create App > import this spec)
#   3. Set every SECRET value in the dashboard (App > Settings > Environment Variables).
# See DEPLOYMENT.md for the full steps.
name: sca-be
region: sgp # Singapore, closest to the Philippines
services:
  - name: api
    github:
      repo: YOUR_GITHUB_USERNAME/sca-be # TODO: set before use
      branch: master
      deploy_on_push: true
    environment_slug: node-js
    # TypeScript is a devDependency, so include dev packages for the build.
    build_command: npm ci --include=dev && npm run build
    run_command: npm start
    http_port: 8080 # the app reads PORT, which is set below
    instance_count: 1 # keep 1: the cache is in memory (see src/utils/cache.ts)
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BREVO_SENDER_NAME
        value: SCA System

      # Secrets: set the values in the dashboard (never commit them)
      - key: CLIENT_URL # deployed frontend URL, no trailing slash
        scope: RUN_TIME
        type: SECRET
      - key: ENCRYPTION_KEY # must be the same key as on Render, or old encrypted data can't be read
        scope: RUN_TIME
        type: SECRET
      - key: ENCRYPTION_KEY_PREVIOUS # only during a key rotation (see DEPLOYMENT.md)
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      # App Platform has no secret files, so paste the whole sca.json content (one line) here
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        scope: RUN_TIME
        type: SECRET
      - key: BREVO_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BREVO_SENDER_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: R2_ACCOUNT_ID
        scope: RUN_TIME
        type: SECRET
      - key: R2_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: R2_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: R2_BUCKET
        scope: RUN_TIME
        type: SECRET
